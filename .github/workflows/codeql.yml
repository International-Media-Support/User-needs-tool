# NOTE: code scanning is free on PUBLIC repositories only. On a private
# repository it requires GitHub Code Security (part of Advanced Security), which
# needs a Team or Enterprise plan and is a paid add-on. When this repository is
# made private, this workflow will stop producing alerts unless that is
# purchased. If it is not, delete this workflow and rely on npm audit in ci.yml
# plus Dependabot alerts, and record the reduced coverage in the compliance
# document.

name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v3
