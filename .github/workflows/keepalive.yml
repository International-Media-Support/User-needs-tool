name: Keep-alive

# Interim measure only: prevents the free Supabase project pausing after 7 days
# idle by issuing a trivial query every 3 days. Remove once the database is on
# Supabase Pro (Pro does not pause). Requires a repository secret
# SUPABASE_DB_URL set to the project's session-pooler connection string.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: psql "$SUPABASE_DB_URL" -c 'select 1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
